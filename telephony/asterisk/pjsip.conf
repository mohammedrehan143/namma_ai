; ====================================================================
; Namma AI Telephony — Asterisk PJSIP Configuration for Exotel
; File: /etc/asterisk/pjsip.conf
; ====================================================================

; --------------------------------------------------------------------
; 1. Global UDP Transport (Port 5060)
; --------------------------------------------------------------------
[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060
local_net=172.16.0.0/12
local_net=192.168.0.0/16
local_net=10.0.0.0/8
external_media_address=<YOUR_ASTERISK_PUBLIC_IP>
external_signaling_address=<YOUR_ASTERISK_PUBLIC_IP>

; --------------------------------------------------------------------
; 2. Outbound Registration (When Exotel requires SIP registration)
; --------------------------------------------------------------------
[exotel-reg]
type=registration
transport=transport-udp
outbound_auth=exotel-auth
server_uri=sip:<EXOTEL_SIP_GATEWAY>:5060
client_uri=sip:<EXOTEL_SIP_USERNAME>@<EXOTEL_SIP_GATEWAY>:5060
retry_interval=60
expiration=3600
line=yes
endpoint=exotel-trunk

; --------------------------------------------------------------------
; 3. Authentication Credentials
; --------------------------------------------------------------------
[exotel-auth]
type=auth
auth_type=userpass
username=<EXOTEL_SIP_USERNAME>
password=<EXOTEL_SIP_PASSWORD>

; --------------------------------------------------------------------
; 4. Address of Record (AOR)
; --------------------------------------------------------------------
[exotel-trunk]
type=aor
contact=sip:<EXOTEL_SIP_GATEWAY>:5060

; --------------------------------------------------------------------
; 5. Exotel Trunk Endpoint
; --------------------------------------------------------------------
[exotel-trunk]
type=endpoint
transport=transport-udp
context=from-exotel
disallow=all
allow=alaw
allow=ulaw
allow=g722
aors=exotel-trunk
outbound_auth=exotel-auth
direct_media=no
force_rport=yes
rewrite_contact=yes
rtp_symmetric=yes

; --------------------------------------------------------------------
; 6. IP Identification (Match inbound SIP INVITE from Exotel gateway)
; --------------------------------------------------------------------
[exotel-identify]
type=identify
endpoint=exotel-trunk
match=<EXOTEL_SIP_GATEWAY_IP_OR_CIDR>
