; ====================================================================
; Namma AI Telephony — Asterisk Dialplan & Voice Loop
; File: /etc/asterisk/extensions.conf
; ====================================================================

[general]
static=yes
writeprotect=no
clearglobalvars=no

[from-exotel]
; Inbound route for Exotel Indian Virtual Number / DID
exten => _X.,1,NoOp(====================================================)
 same => n,NoOp(--- INCOMING CALL FROM EXOTEL: ${CALLERID(num)} TO ${EXTEN} ---)
 same => n,NoOp(====================================================)
 same => n,Answer()
 same => n,Wait(1)

 ; Generate unique session ID for this call
 same => n,Set(SESSION_ID=${CALLERID(num)}-${EPOCH}-${UNIQUEID})
 same => n,Set(RECORD_DIR=/tmp/ai_voice_${SESSION_ID})
 same => n,Set(TURN_COUNT=0)
 same => n,Set(API_BASE=https://namma-ai.onrender.com/api/voice)
 same => n,System(mkdir -p ${RECORD_DIR})

 ; Push Hangup Handler for graceful teardown and async n8n WhatsApp trigger
 same => n,Set(CHANNEL(hangup_handler_push)=call-teardown,s,1(${SESSION_ID}))

 ; Handshake with Namma AI Voice Gateway and download greeting audio
 same => n,NoOp(--- Fetching greeting audio from Namma AI Voice Gateway ---)
 same => n,System(curl -s "${API_BASE}/session/start?session_id=${SESSION_ID}&caller_id=${CALLERID(num)}" -o "${RECORD_DIR}/greeting.wav")

 ; Verify greeting audio was generated; fallback to system beep if needed
 same => n,GotoIf($[${STAT(e,${RECORD_DIR}/greeting.wav)} = 1]?play_greeting:fallback_greeting)

 same => n(play_greeting),NoOp(Playing Namma AI Greeting with Barge-In...)
 ; Background() allows the caller to speak or press '#' to interrupt playback
 same => n,Background(${RECORD_DIR}/greeting)
 same => n,Goto(turn_loop)

 same => n(fallback_greeting),Playback(beep)
 same => n,Goto(turn_loop)

 ; ====================================================================
 ; Conversational Turn Loop
 ; ====================================================================
 same => n(turn_loop),Set(TURN_COUNT=$[${TURN_COUNT} + 1])
 same => n,NoOp(--- STARTING CONVERSATION TURN ${TURN_COUNT} [SESSION: ${SESSION_ID}] ---)

 ; Exit condition: Max 15 turns per call to prevent runaway loops
 same => n,GotoIf($[${TURN_COUNT} > 15]?max_turns:record_caller)

 same => n(record_caller),NoOp(--- Recording caller utterance (16kHz PCM WAV) ---)
 ; Record parameters:
 ; format: wav16 (16kHz mono Linear PCM)
 ; silence_timeout: 2 seconds of silence finishes utterance
 ; max_duration: 20 seconds maximum per turn
 ; flags: 'k' keeps recording on hangup, 's' skips if already silent
 same => n,Record(${RECORD_DIR}/turn_${TURN_COUNT}_in.wav16,2,20,k)

 ; Dispatch recorded audio to Namma AI (Faster-Whisper STT -> LLM -> Piper TTS)
 same => n,NoOp(--- Sending audio to Namma AI Voice Gateway ---)
 same => n,System(curl -s -X POST -F "audio=@${RECORD_DIR}/turn_${TURN_COUNT}_in.wav" -F "session_id=${SESSION_ID}" -F "caller_id=${CALLERID(num)}" "${API_BASE}/turn" -o "${RECORD_DIR}/turn_${TURN_COUNT}_out.wav" -D "${RECORD_DIR}/turn_${TURN_COUNT}_headers.txt")

 ; Check if response audio exists and has valid size (>1000 bytes)
 same => n,GotoIf($[${STAT(s,${RECORD_DIR}/turn_${TURN_COUNT}_out.wav)} > 1000]?play_ai_response:handle_error)

 same => n(play_ai_response),NoOp(--- Playing AI response with Barge-In ---)
 ; Background() plays audio while listening for voice activity / DTMF interruption
 same => n,Background(${RECORD_DIR}/turn_${TURN_COUNT}_out)

 ; Check if Namma AI signaled call completion (X-Voice-Action: HANGUP)
 same => n,Set(ACTION=${SHELL(grep -i "X-Voice-Action: HANGUP" ${RECORD_DIR}/turn_${TURN_COUNT}_headers.txt | tr -d '\r\n')})
 same => n,GotoIf($["${ACTION}" != ""]?conclude_call:turn_loop)

 same => n(handle_error),NoOp(--- STT or TTS fallback ---)
 same => n,Playback(beep)
 same => n,Goto(turn_loop)

 same => n(conclude_call),NoOp(--- AI marked complaint registered. Hanging up ---)
 same => n,Wait(1)
 same => n,Hangup()

 same => n(max_turns),Playback(vm-goodbye)
 same => n,Hangup()

; ====================================================================
; Hangup and Cleanup Handler
; ====================================================================
[call-teardown]
exten => s,1,NoOp(====================================================)
 same => n,NoOp(--- CALL COMPLETED: TEARDOWN FOR SESSION ${ARG1} ---)
 same => n,NoOp(====================================================)
 ; Call Namma AI to finalize session and trigger asynchronous n8n WhatsApp confirmation
 same => n,System(curl -s -X POST -H "Content-Type: application/json" -d '{"session_id":"${ARG1}"}' "https://namma-ai.onrender.com/api/voice/session/end")
 ; Clean up temporary turn audio files
 same => n,System(rm -rf /tmp/ai_voice_${ARG1})
 same => n,Return()
